<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Copilot · 云顶之弈 AI 教练</title>
    <!-- marked.js：本地 vendor（随二进制 embed，始终可用）。
         FIX-04 起移除 CDN 依赖与全部内联脚本，以支持 strict CSP（script-src 'self'）：
         页面内不再有任何 <script>…</script> 内联块与 on*= 内联事件属性。 -->
    <script src="assets/vendor/marked.min.js?v=20260908"></script>
    <!-- vendor 加载失败时补位 window.marked，保证 renderMd 不退化 -->
    <script src="assets/vendor/marked_fallback.js?v=20260908"></script>
    <!-- FIX-04：HTML 白名单清洗器，所有 Markdown 渲染输出的统一防线 -->
    <script src="assets/sanitizer.js?v=20260908"></script>
    <!-- 字体：优先 Google Fonts，离线时自动降级为系统中文字体（CSP 已放行） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="assets/app.css?v=20260908">
</head>
<!-- data-layout: web（默认全页） | compact（桌面小窗/Wails） | pet（桌宠预留） -->
<body data-layout="web">

<div id="app">

    <!-- ══ 侧边栏 ══ -->
    <aside id="sidebar" aria-label="侧边栏">
        <div class="side-head">
            <div class="brand">
                <span class="brand-icon">⚔</span>
                <span class="brand-name">TFT Copilot</span>
            </div>
            <button class="newchat-btn" id="newchat-btn" type="button">
                <span class="plus">＋</span> 新对话
            </button>
        </div>

        <nav class="conv-list" id="conv-list" aria-label="历史对话"></nav>

        <div class="side-foot">
            <div class="conn" id="conn" title="服务连接状态">
                <span class="status-dot" id="status-dot"></span>
                <div class="conn-texts">
                    <span id="conn-text">连接中…</span>
                    <span class="conn-sub" id="conn-sub"></span>
                </div>
            </div>
            <button class="icon-btn" id="settings-btn" title="服务器设置" aria-label="服务器设置">⚙</button>
        </div>
    </aside>
    <div class="side-mask" id="side-mask"></div>

    <!-- ══ 主区域 ══ -->
    <main id="main">
        <header id="topbar">
            <button class="icon-btn" id="side-toggle" title="收起 / 展开侧边栏" aria-label="收起或展开侧边栏">☰</button>
            <div class="topbar-title" id="topbar-title">TFT Copilot</div>
            <div class="topbar-right">
                <span class="status-dot topbar-dot" id="topbar-dot" title="服务连接状态"></span>
                <button class="icon-btn wails-only" id="minimize-btn" title="最小化" aria-label="最小化">—</button>
            </div>
        </header>

        <div id="scroll">
            <!-- 欢迎空状态（会话无消息时显示） -->
            <section class="welcome" id="welcome">
                <div class="welcome-hero">⚔</div>
                <h1 class="welcome-title">有什么可以帮你？</h1>
                <p class="welcome-sub">云顶之弈 AI 教练 · 阵容 / 装备 / 英雄 / 羁绊 / 局内决策</p>
                <div class="cap-cards" id="cap-cards"></div>
                <p class="welcome-meta" id="welcome-meta"></p>
            </section>

            <!-- 消息列表 -->
            <div class="messages" id="messages" aria-live="polite"></div>
        </div>

        <!-- 输入组合器 -->
        <div class="composer-wrap">
            <div class="composer" id="composer">
                <div class="coach-row" id="coach-row">
                    <div class="coach-groups" id="coach-groups"></div>
                </div>
                <textarea
                        id="chat-input"
                        placeholder="问阵容、装备、羁绊，或描述当前局面…"
                        rows="1"
                ></textarea>
                <div class="composer-bar">
                    <button class="mini-btn" id="coach-toggle" type="button" aria-expanded="false">
                        ⚡ 局面快填
                    </button>
                    <span class="composer-hint">
                        <kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行
                    </span>
                    <button class="send-btn" id="send-btn" title="发送" aria-label="发送">➤</button>
                </div>
            </div>
            <p class="composer-foot">同一会话内支持多轮追问与教练反馈 · AI 生成内容仅供参考 · <span title="前端构建标记">UI v20260803</span></p>
        </div>
    </main>
</div>

<!-- ══ 设置弹窗 ══ -->
<div class="modal-mask" id="settings-modal">
    <div class="modal-card" role="dialog" aria-label="服务器设置">
        <button class="icon-btn modal-close" id="settings-close" title="关闭" aria-label="关闭">✕</button>
        <h3 class="modal-title">服务器设置</h3>
        <label for="api-input">后端服务器地址</label>
        <input type="text" id="api-input" placeholder="http://your-server:8080" spellcheck="false" autocomplete="off" />
        <button class="settings-save" id="settings-save">保存并重连</button>
        <div class="settings-divider"></div>
        <div class="settings-health">
            <div class="health-row"><span>服务状态</span><b id="health-status">—</b></div>
            <div class="health-row"><span>版本</span><b id="health-version">—</b></div>
            <div class="health-row"><span>已加载阵容</span><b id="health-comps">—</b></div>
        </div>
        <div class="settings-tip">修改服务器后，各对话的多轮上下文会重新开始</div>
    </div>
</div>

<script src="assets/app.js?v=20260908"></script>
</body>
</html>
